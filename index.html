<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>地球八大奇迹 · Tellux</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="viewer"></div>

      <header class="hud">
        <h1>地球奇迹与现代巨构</h1>
        <p class="sub">Global Architectural Wonders & Megastructures · Tellux 3D Earth</p>
      </header>

      <button id="btn-mobile-list" class="mobile-floating-pill" type="button">📜 奇迹列表</button>

      <aside class="panel" id="panel">
        <button id="btn-panel-close" class="panel-close-btn" type="button" aria-label="收起列表">✕</button>
        <div class="panel-grabber" id="panel-grabber" aria-hidden="true"></div>
        <div class="panel-header">
          <h2>风貌主题</h2>
          <div class="category-tabs" id="category-tabs" role="tablist" aria-label="建筑风貌分类">
            <button class="cat-tab active" data-cat="all" type="button" title="查看全部地标">🌐 全部</button>
            <button class="cat-tab" data-cat="ancient" type="button" title="古典与古代奇迹">🏛️ 古代</button>
            <button class="cat-tab" data-cat="megastructure" type="button" title="现代工程与科研巨构">🚀 巨构</button>
            <button class="cat-tab" data-cat="skyline" type="button" title="先锋地标与摩天都市">🏙️ 先锋</button>
            <button class="cat-tab" data-cat="infrastructure" type="button" title="世纪跨海桥隧与人工岛工程">🌉 跨海</button>
          </div>
        </div>
        <div id="wonder-list" class="wonder-list"></div>
        <div class="actions">
          <button id="btn-tour" class="action" type="button">环球巡礼</button>
          <button id="btn-space" class="action" type="button">返回太空</button>
        </div>
        <p class="hint">
          拖动旋转地球，滚轮缩放。点击分类胶囊快速筛选地标。底图为 ArcGIS 全球影像。
        </p>
      </aside>

      <article id="detail" class="detail hidden">
        <button id="detail-close" class="detail-close-btn" type="button" aria-label="关闭详情卡">✕</button>
        <div class="sheet-grabber" id="detail-grabber" aria-hidden="true"></div>
        <div class="kicker" id="detail-kicker"></div>
        <h3 id="detail-title"></h3>
        <div class="en" id="detail-en"></div>
        <p id="detail-blurb"></p>
        <div id="sheet-expand-hint" class="sheet-expand-hint">轻触或上滑查看详情与实景对照 ▴</div>
        <div id="detail-specs" class="detail-specs hidden"></div>
        <div id="inspection-bar" class="inspection-bar hidden">
          <div class="inspection-title">🛠️ 工程剖析 (Pentagon3D 模式)</div>
          <div class="inspection-actions">
            <button id="btn-wireframe" class="inspect-btn" type="button">📐 线框网格</button>
            <button id="btn-nightmode" class="inspect-btn" type="button">🌓 窗光夜景</button>
          </div>
        </div>
        <section id="photo-comparison" class="photo-comparison hidden" aria-label="模型与实景照片对比">
          <div class="comparison-heading"><span>实景对照</span><span>3D 模型 · 实际照片</span></div>
          <a id="comparison-source" href="#" target="_blank" rel="noopener noreferrer">
            <img id="comparison-image" alt="" loading="lazy" />
          </a>
          <small id="comparison-credit"></small>
        </section>
      </article>

      <!-- 3D 构件交互热点图层 -->
      <div id="hotspot-layer" class="hotspot-layer" aria-label="建筑关键构件热点"></div>

      <!-- 建筑解构与文化知识卡片 -->
      <aside id="hotspot-card" class="hotspot-card hidden" role="dialog" aria-labelledby="hotspot-card-title">
        <button class="hotspot-card-close" type="button" aria-label="关闭卡片">✕</button>
        <div class="hotspot-card-header">
          <span class="hotspot-card-badge">建筑奇观</span>
          <h4 id="hotspot-card-title" class="hotspot-card-title-zh">构件名称</h4>
          <div class="hotspot-card-title-en">Component English Name</div>
        </div>
        <p class="hotspot-card-summary"></p>
        <div class="hotspot-card-desc"></div>
        <div class="hotspot-card-fact">
          <span class="hotspot-card-fact-label">💡 历史冷知识</span>
          <p class="hotspot-card-fact-text"></p>
        </div>
        <div class="hotspot-card-actions">
          <button id="btn-hotspot-return" class="action" type="button">返回奇迹全景</button>
        </div>
      </aside>

      <!-- 浮动光影与航拍控制台 (Solar & Orbit Dock) -->
      <nav id="solar-dock" class="solar-dock" aria-label="昼夜光影与航拍控制">
        <div class="solar-presets">
          <button id="btn-solar-realtime" class="solar-preset-btn" type="button" data-preset="realtime" title="回到现实正常时间 (实时光影) [R]">
            <span class="icon">⏱️</span>
            <span class="text">实时</span>
          </button>
          <button id="btn-solar-dawn" class="solar-preset-btn" type="button" data-preset="dawn" title="晨曦 (06:00)">
            <span class="icon">🌅</span>
            <span class="text">晨曦</span>
          </button>
          <button id="btn-solar-noon" class="solar-preset-btn active" type="button" data-preset="noon" title="正午 (12:00)">
            <span class="icon">☀️</span>
            <span class="text">正午</span>
          </button>
          <button id="btn-solar-golden" class="solar-preset-btn" type="button" data-preset="golden" title="黄金时刻 (17:45)">
            <span class="icon">🌇</span>
            <span class="text">黄昏</span>
          </button>
          <button id="btn-solar-night" class="solar-preset-btn" type="button" data-preset="night" title="静谧夜景 (22:30)">
            <span class="icon">🌙</span>
            <span class="text">夜景</span>
          </button>
        </div>
        <div class="solar-slider-wrap">
          <span class="solar-time-label" id="solar-time-label">12:00</span>
          <input id="solar-slider" type="range" min="0" max="23.9" step="0.1" value="12" class="solar-slider" title="拖动调节 24 小时太阳时刻" />
          <button id="btn-timelapse" class="solar-timelapse-btn" type="button" title="播放/暂停昼夜延时摄影">▶ 延时</button>
        </div>
        <div class="solar-dock-divider"></div>
        <button id="btn-drone-orbit" class="drone-orbit-btn" type="button" title="开启/停止 360° 电影级无人机环绕航拍">
          <span class="orbit-icon">🛸</span>
          <span class="orbit-text">航拍环绕</span>
        </button>
        <div class="solar-dock-divider"></div>
        <button id="btn-postcard" class="postcard-trigger-btn" type="button" title="一键生成专属建筑明信片海报 [P]">
          <span class="postcard-btn-icon">📷</span>
          <span class="postcard-btn-text">生成明信片</span>
        </button>
      </nav>

      <div id="status" class="status">正在初始化地球…</div>

      <div id="error-box" class="error-box hidden" role="alert">
        <strong>场景加载失败</strong>
        <pre id="error-msg"></pre>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
